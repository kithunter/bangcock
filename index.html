      // in the app: show the picture, and let the system splash (the icon) go once it's loaded (src/native/shell.ts hideSplash takes it away)

        if (!C || !C.isNativePlatform || !C.isNativePlatform()) return;
        document.documentElement.classList.add('app');
        var i = new Image();
        i.onload = i.onerror = function () { try { C.nativePromise('SplashScreen', 'hide', {}); } catch (e) {} };
        i.src = 'assets/app/splash.webp';
      })();
