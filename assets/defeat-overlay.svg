<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
<!-- Overlay for the head region of rooster-player.svg: head centre ~(198,62), comb top ~(200,22). Transparent elsewhere. -->
<defs>
<path id="o-s" d="M0 -26 L7 -9 L26 -8 L11 3 L16 22 L0 12 L-16 22 L-11 3 L-26 -8 L-7 -9Z"/>
<path id="o-w" d="M0 -17 C7 -7 11 -1 11 6 C11 13 6 17 0 17 C-6 17 -11 13 -11 6 C-11 -1 -7 -7 0 -17Z"/>
<g id="o-lf"><path d="M0 0 C18 -20 52 -24 80 -8 C58 8 26 14 0 0Z"/><path d="M4 0 C28 -8 54 -11 76 -8" fill="none" stroke-width="3.5"/></g>
</defs>
<!-- ruffled feathers sticking up from the head -->
<g stroke="#262626" stroke-width="2.16" stroke-linejoin="round" stroke-linecap="round">
<use href="#o-lf" transform="translate(172 52) rotate(-118) scale(.34)" fill="#f7c93a"/>
<use href="#o-lf" transform="translate(180 44) rotate(-86) scale(.3)" fill="#f08a22"/>
<use href="#o-lf" transform="translate(228 40) rotate(-40) scale(.3)" fill="#f7c93a"/>
</g>
<!-- bumps -->
<g stroke="#262626" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round">
<circle cx="182" cy="68" r="11" fill="#f2793c"/>
<path d="M175 65 C176 60 179 57 183 57" fill="none" stroke="#ffc9a0" stroke-width="3"/>
<circle cx="214" cy="84" r="7" fill="#f2793c"/>
<path d="M164 56 l-9 -5 M162 72 l-11 -1 M172 44 l-5 -8 M190 50 l-2 -8" fill="none" stroke-width="3"/>
</g>
<!-- plaster on the comb + a small one on the cheek -->
<g stroke="#262626" stroke-width="2.04" stroke-linejoin="round" fill="#f3d7a8">
<g transform="translate(200 40)">
<rect x="-18" y="-6" width="36" height="12" rx="4" transform="rotate(-32)"/>
<rect x="-18" y="-6" width="36" height="12" rx="4" transform="rotate(32)"/>
<g fill="#d8b87c" stroke="none"><circle cx="-6" cy="-2" r="1.3"/><circle cx="6" cy="-2" r="1.3"/><circle cx="-6" cy="3" r="1.3"/><circle cx="6" cy="3" r="1.3"/></g>
</g>
<g transform="translate(206 92) rotate(-24)"><rect x="-13" y="-5" width="26" height="10" rx="4"/></g>
</g>
<!-- dizzy stars orbiting the head -->
<g stroke="#262626" stroke-width="2.04" stroke-linejoin="round" fill="#ffe27a">
<use href="#o-s" transform="translate(146 26) scale(.55)"/>
<use href="#o-s" transform="translate(238 18) scale(.5)"/>
<use href="#o-s" transform="translate(248 100) scale(.42)"/>
<use href="#o-s" transform="translate(156 104) scale(.36)"/>
</g>
<!-- sweat -->
<g stroke="#262626" stroke-width="1.92" stroke-linejoin="round" fill="#bfe6ff">
<use href="#o-w" transform="translate(236 118) rotate(24) scale(.6)"/>
<use href="#o-w" transform="translate(150 70) rotate(-28) scale(.5)"/>
</g>
<!-- loose feathers drifting down -->
<g stroke="#262626" stroke-width="2.04" stroke-linejoin="round" stroke-linecap="round">
<use href="#o-lf" transform="translate(222 140) rotate(-40) scale(.32)" fill="#f7c93a"/>
<use href="#o-lf" transform="translate(140 118) rotate(-70) scale(.28)" fill="#f08a22"/>
<use href="#o-lf" transform="translate(236 168) rotate(-20) scale(.24)" fill="#f6f3ea"/>
